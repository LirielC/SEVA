[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seva"
version = "0.1.0"
description = "SEVA: Secure Experimentation and Validation Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "optuna>=3.5.0",
    "mlflow>=2.10.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.31.0",
    "pytest>=8.0.0",
]

[project.scripts]
seva = "autoresearcher.cli:main"
autoresearcher = "autoresearcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
