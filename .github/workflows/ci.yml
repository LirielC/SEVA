name: CI - Test & Benchmark Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run Pytest & Benchmark Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (OpenMP for XGBoost/CatBoost)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run Test Suite (pytest)
        run: |
          pytest -v --tb=short

      - name: Run Benchmark Smoke Test (CLI)
        run: |
          python -m autoresearcher.cli run-benchmark --budget 4 --seeds 42 --offline

      - name: Verify Generated Artifacts
        run: |
          test -f artifacts/BENCHMARK_REPORT.md
          test -f artifacts/plots/convergence_curves.png
          test -f artifacts/plots/holdout_and_efficiency.png
          echo "All scientific artifacts and plots successfully verified!"

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-artifacts
          path: |
            artifacts/BENCHMARK_REPORT.md
            artifacts/plots/*.png
            artifacts/runs/*.json
